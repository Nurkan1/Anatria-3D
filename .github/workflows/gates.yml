# Every quality gate, on a clean machine.
#
# The point is not to duplicate what a developer runs locally — it is that a
# laptop accumulates state. A gate that passes only because something is already
# installed, cached or half-built is not a gate.
name: Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nobody needs the results of a commit that
# has already been replaced.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # Windows, because that is what ships. The Rust dependency tree differs by
    # platform — GTK on Linux, WebView2 here — so a green Linux build would be
    # proving something about a binary nobody installs.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Floating majors, all of them on the Node 24 runtime. Node 20 left
      # maintenance, and GitHub already forces the old actions onto 24 with a
      # warning — when it stops forcing, a pinned Node 20 action does not run
      # at all, and that would take the release workflow with it.
      #
      # Two are deliberately not bumped, and neither is an oversight:
      # Swatinem/rust-cache@v2 is already `using: node24`, and
      # dtolnay/rust-toolchain is a composite action with no Node runtime to
      # deprecate.
      - uses: actions/checkout@v7

      # No `version:` here on purpose. `packageManager` in package.json is the
      # single source of truth for which pnpm this repository uses, and
      # `pnpm/action-setup` **refuses to run when both are set** — even when
      # they agree, which is how this was first broken. The field in
      # package.json is also the more useful half: it pins an exact version
      # rather than a major, and it governs a laptop as well as a runner, so
      # the two cannot drift.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # At the repository root, and that is not arbitrary: the IPC contract test
      # spawns `.venv` from here to generate the Pydantic side of the protocol
      # surface. Put it anywhere else and that test cannot run.
      - name: Create the engine virtualenv
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -e "engine[dev]"

      # First, because it is the cheapest thing here and the only one that
      # fails for a reason no compiler can see. Five files name the version,
      # in four formats, and nothing else in the toolchain notices when a bump
      # leaves one behind — see tools/check-version.mjs for what each costs.
      - name: Versions agree
        run: node tools/check-version.mjs

      - name: TypeScript
        run: pnpm typecheck

      # Includes the IPC contract test, which is the only thing standing between
      # the Zod and Pydantic definitions of the wire format drifting apart.
      - name: TypeScript tests
        run: pnpm test

      - name: Python tests
        run: .venv/Scripts/python -m pytest engine -q

      - name: Python lint
        run: .venv/Scripts/python -m ruff check engine

      # Before any Rust step. Tauri's build script validates the resource paths
      # declared in tauri.conf.json, and the sidecar is one of them — so even
      # `cargo test` fails on a clean machine without it. It passed locally only
      # because a previous build had left the directory behind, which is the
      # class of false gate this workflow exists to catch.
      #
      # It doubles as a gate in its own right: if build_sidecar.py breaks, that
      # should surface on the push that broke it, not at release time.
      - name: Build the Python sidecar
        run: .venv/Scripts/python engine/build_sidecar.py

      # Its own virtualenv, because the SDK must never reach the root one:
      # build_sidecar.py collects all of pydantic_ai, which declares an `mcp`
      # extra whose module is already inside that package, so the SDK beside it
      # would freeze 73 MB of transport stack into the shipped engine. Created
      # after the sidecar is built rather than before, so the artifact is always
      # frozen from a root venv that nothing in this job has touched.
      #
      # The SDK major is pinned. Its API moved once already — the server class
      # was renamed and the result attributes changed case — and a gate that
      # breaks on somebody else's release teaches the team to ignore it.
      - name: Create the MCP server virtualenv
        run: |
          python -m venv tools/anatria_mcp/.venv
          tools/anatria_mcp/.venv/Scripts/python -m pip install --upgrade pip
          tools/anatria_mcp/.venv/Scripts/python -m pip install "mcp>=2.1,<3" pytest anyio

      # These spawn the server over stdio exactly as a client does, so they
      # cover the wire shape and not just the functions behind it. That shape is
      # the one thing here nobody can change back: an external client reads
      # these field names, and it is not in this repository.
      - name: MCP server tests
        run: tools/anatria_mcp/.venv/Scripts/python -m pytest tools/anatria_mcp -q

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
