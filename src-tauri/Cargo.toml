[package]
name = "anatria3d"
version = "0.2.3"
description = "Interactive anatomy and AI insights"
authors = ["PYSBG"]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[lib]
name = "anatria3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `protocol-asset`: the anatomy meshes live in `public/` and ship inside the
# web bundle, so the viewer fetches them as ordinary same-origin URLs. They are
# ~300 KB — small enough that giving the webview filesystem read access to load
# them would be a poor trade.
# `devtools` in release too. The application keeps no secret in the web
# context — API keys never cross into JavaScript — so the only thing it
# exposes is the frontend itself, and it is the difference between a bug
# report that says "it forgets my settings" and one that names the error.
tauri = { version = "2", features = ["devtools"] }
# Deliberately no `tauri-plugin-shell`: the engine is spawned with
# `std::process::Command` from Rust (see src/sidecar.rs), so the webview is
# granted no ability to execute anything at all.
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Default features give the platform-native credential store on every target
# we ship: Keychain on macOS, Credential Manager on Windows, Secret Service on
# Linux. No secrets are written to application storage or to disk by us.
keyring = "4"

# The study journal (notes, saved sessions, case drills). `bundled` compiles
# SQLite into the binary, so there is no system library to find on a student's
# machine and no version skew between the three platforms we ship.
#
# It lives in Rust rather than in the Python sidecar on purpose. The sidecar is
# the process that holds API keys and talks to the network, and it is the one we
# kill and restart on a crash — the user's own notes should share neither
# property.
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Exported view images cross the IPC boundary as base64. A multi-megabyte PNG
# sent as a JSON array of bytes is not a payload, it is a stall.
base64 = "0.23.1"

# The control bridge's named-pipe ACL, and nothing else. Already in the tree by
# way of Tauri, so declaring it directly adds no new supply chain — see
# src/control_acl.rs for why the descriptor is written out by hand.
# The pairing token, and only that. Already in the tree three times over by way
# of Tauri; declaring it directly reuses one rather than adding a fourth. The
# OS randomness matters here — a predictable token looks exactly like a working
# one, which is the failure worth spending a dependency to avoid.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
# Enabled by `tauri build --features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
