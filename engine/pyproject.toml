[project]
name = "anatria-engine"
version = "0.1.0"
description = "Anatria3D AI sidecar — multi-provider agent with typed 3D scene control"
license = "Apache-2.0"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.13.4",
    # Slim install with only the three providers the app exposes. The full
    # `pydantic-ai` package pulls in every provider integration, which would
    # roughly triple the PyInstaller bundle for no benefit.
    "pydantic-ai-slim[anthropic,google,openai]>=2.25.0",
]

# NOTE: there is no PDF renderer here, and there will not be one. Printing is
# done by the webview — see `src/features/study/PrintSheet.tsx`. Every Python
# candidate carried a constraint worth refusing: PyMuPDF is AGPL unless
# licensed, WeasyPrint needs a GTK runtime shipped on Windows, and ReportLab
# would need a bundled font per script the assistant can answer in, with no
# answer at all for right-to-left. The browser engine already has the system's
# fonts and the layout engine, and costs nothing in the installer.

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anatria_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Flags Cyrillic characters as "ambiguous" look-alikes for Latin ones.
    # Bulgarian is a primary target language here, so Cyrillic in UI strings is
    # the intended content, not a homoglyph mistake.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
